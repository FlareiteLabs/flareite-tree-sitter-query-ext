# Tree-sitter Query: highlighting from a Tree-sitter grammar compiled to
# WebAssembly. No code. See Flareite's docs/extensions.md#languages.
id = "flareite.tree-sitter-query"
name = "Tree-sitter Query"
version = "1.0.0"
description = "Tree-sitter Query highlighting."
author = "Flareite"
api_version = "2"

[engines]
flareite = ">=0.1.0"

[[languages]]
id = "tree-sitter-query"
name = "Tree-sitter Query"
file_extensions = ["scm"]
grammar = "grammars/tree-sitter-query.wasm"
# The grammar exports tree_sitter_query, not tree_sitter_tree_sitter_query.
grammar_name = "query"
highlights = "queries/highlights.scm"
folds = "queries/folds.scm"
injections = "queries/injections.scm"
line_comment = ";"
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["(", ")"], ["[", "]"], ["{", "}"]]
auto_closing_pairs = [
  [
    "(",
    ")",
  ],
  [
    "[",
    "]",
  ],
  [
    "{",
    "}",
  ],
  { open = '"', close = '"', not_in = [
    "string",
    "comment",
  ] },
]
